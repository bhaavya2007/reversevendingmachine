<!DOCTYPE html>
<html>
<head>
  <title>EcoRewards</title>
  <style>
    body {font-family: Arial; background: linear-gradient(135deg,#74ebd5,#ACB6E5); display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
    .card {background:white; padding:30px; border-radius:15px; width:320px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.2); animation:fadeIn 0.8s;}
    input {width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc;}
    button {width:100%; padding:12px; background:#4CAF50; color:white; border:none; border-radius:8px;}
    @keyframes fadeIn {from{opacity:0;} to{opacity:1;}}
  </style>
</head>
<body>
<div class="card">
  <h2>Create Account</h2>
  <form method="post">
    <input name="username" placeholder="Username">
    <input name="password" type="password" placeholder="Password">
    <button>Register</button>
  </form>
  <a href="/login">Login</a>
</div>
</body>
</html>
