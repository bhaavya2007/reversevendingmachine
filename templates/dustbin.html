<!DOCTYPE html>
<html>
<head>
  <title>Smart Dustbin</title>

  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .screen {
      border: 4px solid #00ff00;
      padding: 30px;
      font-size: 36px;
      letter-spacing: 6px;
      margin-bottom: 20px;
      min-width: 300px;
      text-align: center;
      box-shadow: 0 0 20px #00ff00;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      background: #00ff00;
      border: none;
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>SMART DUSTBIN DISPLAY</h2>

<div class="screen" id="code">NO CODE</div>

<button onclick="generate()">Simulate Garbage Throw</button>

<script>
function generate(){
  fetch('/trigger_code')
    .then(res => res.text())
    .then(data => {
      document.getElementById("code").innerText = data;
    });
}
</script>

</body>
</html>
