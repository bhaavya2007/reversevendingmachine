<!DOCTYPE html>
<html>
<head>
  <title>EcoRewards</title>
  <style>
    body {font-family: Arial; background: linear-gradient(135deg,#89f7fe,#66a6ff); display:flex; justify-content:center; align-items:center; height:100vh; margin:0;}
    .card {background:white; padding:30px; border-radius:15px; width:320px; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.2); animation:fadeIn 0.8s;}
    input {width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc;}
    button {width:100%; padding:12px; background:#007BFF; color:white; border:none; border-radius:8px;}
  </style>
</head>
<body>
<div class="card">
  <h2>Welcome Back</h2>
  <form method="post">
    <input name="username" placeholder="Username">
    <input name="password" type="password" placeholder="Password">
    <button>Login</button>
  </form>
  <a href="/register">Register</a>
</div>
</body>
</html>
